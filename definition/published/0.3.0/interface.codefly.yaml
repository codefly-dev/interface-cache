kind: interface
publisher: codefly.dev
name: cache
version: 0.3.0
type: capability
description: >-
    A key-value cache layer with TTL, fill leases and invalidation, consumed
    through a library driver. A provider service emits this configuration
    group; a consumer opens the named driver with it (driver: the name the
    driver registers with cache.Register, e.g. "redis"; connection: the
    driver-specific connection string, for "redis" a redis:// or rediss:// URL).
    Every stack operation is scoped to a caller-supplied partition and runs in
    a consistency mode (freshness, write propagation, fill coordination,
    failure) chosen per stack, key space or call; a stack refuses a mode its
    driver's declared capabilities cannot keep. A driver declares what it
    offers (leases, change notices with a delivery bound, gap reports, flush,
    fenced fills, a byte budget); its notices report every change, by any
    writer, and a driver that can lose them reports each gap as it starts and
    ends.
capability:
    configuration: cache
    keys:
        - name: driver
        - name: connection
          secret: true
